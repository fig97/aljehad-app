name: Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run add:android
      - name: Version number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Same signing key on every build (so the app updates in place)
        run: mkdir -p ~/.android && cp keys/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AL-JEHAD.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AL-JEHAD-android-1.0.${{ github.run_number }}
          path: AL-JEHAD.apk
          retention-days: 30
      - name: Keep the latest APK on the "builds" branch (used for the website download link)
        run: |
          mkdir -p /tmp/out && cp AL-JEHAD.apk /tmp/out/ && echo "1.0.${{ github.run_number }}" > /tmp/out/version.txt
          cd /tmp/out && git init -q && git checkout -q -b builds
          git -c user.name="build" -c user.email="build@users.noreply.github.com" add -A
          git -c user.name="build" -c user.email="build@users.noreply.github.com" commit -qm "APK 1.0.${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
