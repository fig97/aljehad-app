name: iPhone app (TestFlight)
# Runs only when started by hand (Actions → iPhone app → Run workflow), after these repository secrets exist:
# APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, "App Manager" role)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run add:ios
      - name: App Store Connect key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$P8" > ~/private_keys/AuthKey_$KEY_ID.p8
      - name: Archive
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive archive \
            DEVELOPMENT_TEAM=$TEAM PRODUCT_BUNDLE_IDENTIFIER=com.aljehad.projectcontrol \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER
      - name: Upload to TestFlight
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/out -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER
